services:
  caddy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./conf:/etc/caddy
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    networks:
      - caddy_proxy

  dozzle:
    image: amir20/dozzle:v10.7@sha256:068025ea622a1ce3e343a138dd9a962429b5187a133aca301bb4991fe7d2b708
    restart: unless-stopped
    environment:
      DOZZLE_BASE: /dozzle
    volumes:
      - dozzle_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - 127.0.0.1:8080:8080
    networks:
      - caddy_proxy

networks:
  caddy_proxy:
    name: caddy_proxy

volumes:
  caddy_data:
  caddy_config:
  caddy_logs:
  awstats_data:
  dozzle_data:
