services:
  atuin:
    image: ghcr.io/atuinsh/atuin:18.23.0@sha256:f232feeead54a0a13132b9cd477e312c3380e9dc90f1db24c4f79ce6c8e034ea
    restart: unless-stopped
    command: start
    environment:
      - ATUIN_HOST=0.0.0.0
      - ATUIN_PATH=/atuin
      - ATUIN_OPEN_REGISTRATION=${ATUIN_OPEN_REGISTRATION}
      - ATUIN_DB_URI=postgres://${DATABASE_USER}:${DATABASE_PASS}@${DATABASE_HOST}/${DATABASE_NAME}
      - RUST_LOG=info,atuin_server=debug
    volumes:
      - ./config:/config
    depends_on:
      database:
        condition: service_healthy
        restart: true
    networks:
      - default
      - caddy_proxy

  database:
    image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASS}
      - POSTGRES_DB=${DATABASE_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]

networks:
  caddy_proxy:
    external: true

volumes:
  postgres_data:
