services:
  atuin:
    image: ghcr.io/atuinsh/atuin:18.24.8@sha256:2bc3a558b236283cd64ce64cf9aa463c24e34f97fc36a4b1a5b2b1853a5dcb49
    restart: unless-stopped
    command: start
    environment:
      - ATUIN_HOST=0.0.0.0
      - ATUIN_PATH=/atuin
      - ATUIN_OPEN_REGISTRATION=${ATUIN_OPEN_REGISTRATION}
      - ATUIN_DB_URI=postgres://${DATABASE_USER}:${DATABASE_PASS}@${DATABASE_HOST}/${DATABASE_NAME}
      - RUST_LOG=info,atuin_server=debug
    volumes:
      - ./config:/config
    depends_on:
      database:
        condition: service_healthy
        restart: true
    networks:
      - default
      - caddy_proxy

  database:
    image: postgres:18@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASS}
      - POSTGRES_DB=${DATABASE_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]

networks:
  caddy_proxy:
    external: true

volumes:
  postgres_data:
