services:
  teslamate:
    image: teslamate/teslamate:4.5.0@sha256:a285b02171a789cf2af5075502d2ec9034b58a42db777a30ae86aef2d0c12af4
    restart: unless-stopped
    environment:
      - DATABASE_USER=${DATABASE_USER}
      - DATABASE_PASS=${DATABASE_PASS}
      - DATABASE_NAME=${DATABASE_NAME}
      - DATABASE_HOST=${DATABASE_HOST}
      - MQTT_HOST=${MQTT_HOST}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - URL_PATH=/teslamate
    volumes:
      - ./import:/opt/app/import
    cap_drop:
      - all
    networks:
      - default
      - caddy_proxy

  database:
    image: postgres:18@sha256:06cad38a5d9f5d24b4d83d86def30795d5e4b757fedbf5281172b576dedcd941
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASS}
      - POSTGRES_DB=${DATABASE_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql

  grafana:
    image: teslamate/grafana:4.5.0@sha256:598c65f4fbefaccc213d16fde5b86b5e71366bd391c00b28ff64b976e0841dde
    restart: unless-stopped
    environment:
      - DATABASE_USER=${DATABASE_USER}
      - DATABASE_PASS=${DATABASE_PASS}
      - DATABASE_NAME=${DATABASE_NAME}
      - DATABASE_HOST=${DATABASE_HOST}
      - GF_SERVER_DOMAIN=home.spirit.frcy.org
      - GF_SERVER_ROOT_URL=https://home.spirit.frcy.org/teslamate/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - grafana_data:/var/lib/grafana
      - ./Teslamate-CustomGrafanaDashboards/customdashboards.yml:/etc/grafana/provisioning/dashboards/customdashboards.yml
      - ./Teslamate-CustomGrafanaDashboards/dashboards:/TeslamateCustomDashboards
    networks:
      - default
      - caddy_proxy

  mosquitto:
    image: eclipse-mosquitto:2@sha256:fa12172a051310efe5bcb7a6a11b77bd5faacb82cbacd7742aa758bf024fd8e4
    restart: unless-stopped
    command: mosquitto -c /mosquitto-no-auth.conf
    ports:
      - 1883:1883
    volumes:
      - mosquitto_conf:/mosquitto/config
      - mosquitto_data:/mosquitto/data

  abrp:
    image: fetzu/teslamate-abrp:4.0.2@sha256:a794a105a89b2762a022a660b01b2acced7f0f37ed6b7c991e7eba6a48925b18
    init: true
    restart: unless-stopped
    environment:
      - MQTT_SERVER=${MQTT_HOST}
      - USER_TOKEN=${USER_TOKEN}
      - CAR_NUMBER=${CAR_NUMBER}
      - CAR_MODEL=${CAR_MODEL}

networks:
  caddy_proxy:
    external: true

volumes:
  postgres_data:
  grafana_data:
  mosquitto_conf:
  mosquitto_data:
