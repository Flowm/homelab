services:
  homeassistant:
    image: homeassistant/home-assistant:2026.8@sha256:14931c6b13756317849f46da1d01b45937a1150db66c081cfe529d48215943fe
    restart: unless-stopped
    environment:
      - PGID=1000
      - PUID=1000
      - TZ=Europe/Berlin
    network_mode: host
    volumes:
      - ./config:/config
      - ./config/docker/run:/etc/services.d/home-assistant/run
    depends_on:
      database:
        condition: service_healthy
        restart: true

  database:
    image: timescale/timescaledb-ha:pg18-ts2.28@sha256:f092d3bb6337f07fa919c505c0b669f930b26aa275d81ab7196ad4fd8991c1f4
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASS}
      - POSTGRES_DB=${DATABASE_NAME}
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - postgres_data:/home/postgres/pgdata
    shm_size: 1gb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]

  grafana:
    image: grafana/grafana:13.2@sha256:3fd54ae1214669f8355f065ec9f6445d5279a3d77095ab048ca045685272429b
    restart: unless-stopped
    environment:
      - DATABASE_USER=${DATABASE_USER}
      - DATABASE_PASS=${DATABASE_PASS}
      - DATABASE_NAME=${DATABASE_NAME}
      - DATABASE_HOST=${DATABASE_HOST}
    ports:
      - 3001:3000
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      database:
        condition: service_healthy
        restart: true

volumes:
  postgres_data:
  grafana_data:
